name: Deploy to Freemius

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Freemius
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create plugin zip
        run: zip -r ai-content-orchestrator.zip . -x '.git/*' '.github/*' '*.DS_Store'

      - name: Deploy to Freemius
        uses: buttonizer/freemius-deploy@v0.1.3
        env:
          DEV_ID: '33246'
          PLUGIN_ID: '28680'
          PLUGIN_SLUG: 'ai-content-orchestrator'
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
        with:
          file_name: 'ai-content-orchestrator.zip'
          version: ${{ steps.version.outputs.VERSION }}
          release_mode: 'released'
