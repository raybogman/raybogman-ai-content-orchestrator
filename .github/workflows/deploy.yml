name: Deploy to Freemius

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Freemius
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create plugin zip
        run: |
          zip -r raybogman-content-orchestrator.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x '*.DS_Store' \
            -x '__MACOSX/*' \
            -x '.gitignore' \
            -x '.gitattributes' \
            -x '.distignore' \
            -x '.editorconfig' \
            -x '.env' \
            -x 'node_modules/*' \
            -x '*.zip' \
            -x 'vendor/freemius/.example.env' \
            -x 'vendor/freemius/.editorconfig' \
            -x 'vendor/freemius/.gitignore' \
            -x 'vendor/freemius/.gitattributes' \
            -x 'vendor/freemius/.phpstan/*' \
            -x 'vendor/freemius/.github/*' \
            -x 'vendor/freemius/CONTRIBUTING.md' \
            -x 'vendor/freemius/composer.lock' \
            -x 'vendor/freemius/patches/*'

      - name: Deploy to Freemius
        uses: buttonizer/freemius-deploy@v0.1.3
        env:
          DEV_ID: '33246'
          PLUGIN_ID: '28680'
          PLUGIN_SLUG: 'raybogman-ai-content-orchestrator'
          PUBLIC_KEY: ${{ secrets.FREEMIUS_PUBLIC_KEY }}
          SECRET_KEY: ${{ secrets.FREEMIUS_SECRET_KEY }}
        with:
          file_name: 'raybogman-content-orchestrator.zip'
          version: ${{ steps.version.outputs.VERSION }}
          release_mode: 'released'

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: raybogman-content-orchestrator-${{ steps.version.outputs.VERSION }}
          path: |
            raybogman-content-orchestrator.zip
            raybogman-content-orchestrator__free.zip
          retention-days: 90
