name: Build plugin zip

# Builds a distributable plugin zip for every push to main and every v* tag.
# The zip is uploaded as a downloadable artifact. (Freemius deployment has been
# removed — this is the free WordPress.org build. A WordPress.org SVN deploy
# step can be added here later if desired.)
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build zip
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          PLUGIN_FILE="raybogman-ai-content-orchestrator.php"
          HEADER_VERSION="$(grep -E '^\s*\*\s*Version:' "$PLUGIN_FILE" | head -1 | sed -E 's/.*Version:[[:space:]]*([0-9.]+).*/\1/')"
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${HEADER_VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved version=${VERSION}"

      - name: Create plugin zip
        run: |
          zip -r raybogman-ai-content-orchestrator.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x '*.DS_Store' \
            -x '__MACOSX/*' \
            -x '.gitignore' \
            -x '.gitattributes' \
            -x '.distignore' \
            -x '.editorconfig' \
            -x '.env' \
            -x 'node_modules/*' \
            -x '*.zip'

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: raybogman-ai-content-orchestrator-${{ steps.version.outputs.VERSION }}-${{ github.sha }}
          path: raybogman-ai-content-orchestrator.zip
          retention-days: 90
